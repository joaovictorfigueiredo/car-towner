<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Towner 3D Isométrico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-wrapper">
        <!-- HUD SUPERIOR CLÁSSICO CAR TOWN -->
        <header class="top-hud">
            <div class="hud-item level-badge">
                <span>Nível</span>
                <span id="player-level">1</span>
            </div>
            <div class="hud-item money-display">
                <span>💰 $<span id="coins">150</span></span>
            </div>
            <div class="hud-item rep-display">
                <span>⭐ <span id="reputation">1</span></span>
            </div>
        </header>

        <!-- TELA DO JOGO EM CANVAS ISOMÉTRICO (3D) -->
        <div class="game-viewport">
            <canvas id="isometricCanvas" width="840" height="420"></canvas>
            
            <!-- PAINEL DE CONTROLE FLUTUANTE -->
            <div class="floating-controls">
                <button id="work-btn" class="cartown-btn primary">Trabalhar na Oficina (+$15)</button>
                <button id="upgrade-engine-btn" class="cartown-btn success">Melhorar Motor ($50)</button>
                <button id="buy-car-btn" class="cartown-btn warning">Comprar Esportivo ($300)</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
